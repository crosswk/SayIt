[package]
name = "sayit"
version = "0.2.5"
authors = ["Liu Qianglong", "Claude"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：macOS 上透明窗口（悬浮窗、更新通知）必须开；在 Windows 上不起作用。
# 与 tauri.conf.json 的 app.macOSPrivateApi 必须同时开关（tauri-build 会对账）。
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
zip = "0.6"
dirs = "5"
hostname = "0.4"
whoami = "1"
base64 = "0.22"
# 校验更新安装包的 SHA-512（manifest 里给的是 Base64 编码）。安装包下载后会在临时
# 目录里等到用户点更新，驻留时间可能很长，装之前必须确认它还是我们下载的那一个。
sha2 = "0.10.8"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
regex = "1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
once_cell = "1"
flate2 = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "fs"] }
# WebDAV 备份包要流式 PUT 上去：含音频的包能有几个 GB，整包读进 Vec<u8> 会直接把
# 内存打满。ReaderStream 把文件转成 reqwest 能吃的 Stream，配 reqwest 的 stream feature。
tokio-util = { version = "0.7", features = ["io"] }
silero-vad-crs = { version = "=0.4.0", features = ["auto"] }

# GGUF / ggml 本地 ASR 引擎（transcribe.cpp 的官方 Rust 绑定，MIT）。
# 计算后端按平台在下面的 target 段里选：Cargo 会合并同一依赖在所有生效段里的 features，
# 写在通用 [dependencies] 里的 vulkan 会连 macOS 一起打开（mac 上没有 Vulkan SDK）。
#
# Windows：
# dynamic-backends：各计算后端编成可 dlopen 的模块（隐含 shared，libtranscribe
# 本身也是 DLL），运行时按 CPU 指令集挑最优的 ggml-cpu-* 模块。
# vulkan：一个 API 覆盖 NVIDIA / AMD / Intel / 核显，没有就自动回落 CPU。
#   构建需要 Vulkan SDK（编 SPIR-V shader）：装完要新开终端，VULKAN_SDK 不会进已运行的 shell。
# 不带 CUDA：官方 CUDA 包 226 MB，Vulkan 已覆盖同样的硬件。
# 注意：首次构建会用 CMake 从源码编整棵 C++ 树（约 20 分钟），之后走缓存。
[target.'cfg(windows)'.dependencies.transcribe-cpp]
version = "0.1.3"
default-features = false
features = ["dynamic-backends", "vulkan"]

# macOS：metal + 静态链接。不开 dynamic-backends，就不会产出要随包分发、逐个签名的
# dylib，build.rs 的暂存步骤也自然跳过（拿不到 DEP_TRANSCRIBE_CPP_RUNTIME_DIR）。
[target.'cfg(target_os = "macos")'.dependencies.transcribe-cpp]
version = "0.1.3"
default-features = false
features = ["metal"]

# 其它平台（Linux 等）只编 CPU 后端，保证能编过；目前不发布。
[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies.transcribe-cpp]
version = "0.1.3"
default-features = false

# macOS 系统集成：AppKit / Foundation 走 objc2（与 tauri/tao 用的是同一套版本，
# 类型可以互通）；CoreGraphics / CoreFoundation / Accessibility / CoreAudio / Carbon
# 这些稳定的 C 接口直接在 src/platform/macos/ffi.rs 里声明，不再引入第二套绑定。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Accessibility",
  "Win32_System_Threading",
  # GetProcessMemoryInfo：报告本地模型加载后的真实内存占用（诊断页 + 调优实测）
  "Win32_System_ProcessStatus",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Graphics_Gdi",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
] }
# 与 tauri/wry 内部同版本，用于挂 WebView2 的 PermissionRequested 处理器（把麦克风置为持久授权）
webview2-com = "0.38"
# webview2-com 0.38 用的 COM 基础类型（Interface::cast、PWSTR）。上面的 windows 0.58 是另一套类型，
# 不能混用；挂 ServerCertificateErrorDetected 时要把 ICoreWebView2 cast 成 ICoreWebView2_14。
windows-core = "0.61"

# Release 体积/性能优化。panic 保持 unwind：Tauri 与 catch_unwind 依赖它，
# 换成 abort 会让引擎 panic 直接杀进程。
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# Windows 托盘右键菜单偶尔卡在屏幕上、点了没反应：tauri 2.10 带的 tray-icon 0.21.3 在右键按下时
# 就弹菜单，TrackPopupMenu 之后也没补发 WM_NULL。vendor/tray-icon 是原版 0.21.3，只改了这两处
# （搜 "SayIt patch"），和上游 tray-icon 0.23 的修法一样。升级到带 tray-icon 0.23 及以上的 tauri
# （2.11 起）之后，删掉这一段和 vendor/tray-icon。
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }
