<!DOCTYPE html>
<!-- Share card template. Rendered to server/web/img/og-{en,zh}.png by server/site/make-og.ps1 (Edge headless, 1200x630). -->
<html lang="en">

<head>
  <meta charset="utf-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      font-family: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      color: #09090b;
      background: #fafafa;
      position: relative;
    }

    .card {
      position: absolute;
      left: 72px;
      top: 64px;
      right: 72px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 700;
      font-size: 30px;
    }

    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 11px;
    }

    h1 {
      margin-top: 56px;
      font-size: 76px;
      line-height: 1.04;
      letter-spacing: -0.035em;
      font-weight: 650;
    }

    /* One line, as on the page. */
    :lang(zh) h1 {
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.16;
      font-size: 76px;
      white-space: nowrap;
    }

    p {
      margin-top: 26px;
      font-size: 28px;
      line-height: 1.4;
      color: #52525b;
    }

    .pill {
      position: absolute;
      left: 72px;
      bottom: 64px;
      display: flex;
      align-items: center;
      gap: 18px;
      height: 72px;
      padding: 0 28px;
      border-radius: 999px;
      background: #0b0b0c;
      color: #fef08a;
      font-size: 22px;
      box-shadow: 0 24px 48px -20px rgba(0, 0, 0, 0.5);
    }

    .bars {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 38px;
    }

    .bars i {
      display: block;
      width: 5px;
      height: 100%;
      border-radius: 99px;
    }

    .site {
      position: absolute;
      right: 64px;
      bottom: 76px;
      font-size: 22px;
      color: #09090b;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="brand"><img src="../web/logo-72.png" alt=""><span>SayIt</span></div>
    <h1 id="t"></h1>
    <p id="s"></p>
  </div>
  <div class="pill"><span class="bars" id="bars"></span><span id="k"></span></div>
  <div class="site">sayitapp.site</div>
  <script>
    const zh = new URLSearchParams(location.search).get('lang') === 'zh'
    document.documentElement.lang = zh ? 'zh-CN' : 'en'
    document.getElementById('t').innerHTML = zh ? '随口说，出色写。' : 'Just say it,<br>and write well.'
    document.getElementById('s').textContent = zh ? '免费开源的语音输入法，支持 Windows 和 Mac' : 'Free, open-source voice typing for Windows and Mac'
    document.getElementById('k').textContent = zh ? '按下右 Alt，开口就行' : 'Press Right Alt. Say it.'
    // Same bars as the page and the app's default rainbow theme (hue 140 -> 30).
    const env = [0.22, 0.38, 0.6, 0.45, 0.78, 0.92, 0.6, 1, 0.82, 0.55, 0.7, 0.96, 0.66, 0.86, 0.5, 0.72, 0.9, 0.62, 0.42, 0.56, 0.36, 0.48, 0.3, 0.2]
    const color = (i) => { const t = i / 23; return `hsl(${140 - Math.round(t * 110)} 95% ${64 - Math.round(Math.abs(t - 0.5) * 12)}%)` }
    document.getElementById('bars').innerHTML = env.map((s, i) => `<i style="transform:scaleY(${s});background:${color(i)};opacity:${0.7 + s * 0.3}"></i>`).join('')
  </script>
</body>

</html>
